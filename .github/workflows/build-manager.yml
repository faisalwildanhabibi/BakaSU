name: Build Manager

on:
  workflow_dispatch:
  push:
    branches:
      - custom/main
    paths:
      - '.github/workflows/build-manager.yml'
      - '.github/workflows/build-lkm.yml'
      - '.github/workflows/ddk-lkm.yml'
      - '.github/workflows/ksud.yml'
      - '.github/workflows/ksuinit.yml'
      - '.github/riscv64-cargo.toml'
      - 'manager/**'
      - 'kernel/**'
      - 'userspace/**'
      - 'scripts/ksubot.py'
  pull_request:
    branches:
      - custom/main
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      expected_size: ${{ steps.extract.outputs.expected_size }}
      expected_hash: ${{ steps.extract.outputs.expected_hash }}
      keystore: ${{ steps.gen.outputs.keystore }}
      keystore_password: ${{ steps.gen.outputs.keystore_password }}
      key_password: ${{ steps.gen.outputs.key_password }}
    steps:
      - name: Check Keystore Availability
        id: check_keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate temporary keystore
        if: steps.check_keystore.outputs.has_keystore == 'false'
        id: gen
        run: |
          KEYSTORE_PASSWORD=$(openssl rand -hex 32)
          KEY_PASSWORD=$(openssl rand -hex 32)
          echo "keystore_password=$KEYSTORE_PASSWORD" >> $GITHUB_OUTPUT
          echo "key_password=$KEY_PASSWORD" >> $GITHUB_OUTPUT

          keytool -genkeypair \
            -alias pr-key \
            -keyalg RSA -keysize 2048 \
            -validity 1 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=KernelSU PR Build" \
            -storetype JKS \
            -keystore pr-key.jks

          echo "keystore=$(base64 -w 0 pr-key.jks)" >> $GITHUB_OUTPUT

      - name: Extract certificate hash and size
        if: steps.check_keystore.outputs.has_keystore == 'false'
        id: extract
        env:
          STORE_PASS: ${{ steps.gen.outputs.keystore_password }}
        run: |
          # Export DER certificate
          keytool -exportcert \
            -alias pr-key \
            -keystore pr-key.jks \
            -storepass "$STORE_PASS" \
            -file pr-cert.der

          # Calculate size in hex
          SIZE_DEC=$(stat -c%s pr-cert.der)
          SIZE_HEX=$(printf '0x%04x' "$SIZE_DEC")
          echo "expected_size=$SIZE_HEX" >> $GITHUB_OUTPUT

          # Calculate SHA256 hash
          HASH=$(sha256sum pr-cert.der | awk '{print $1}')
          echo "expected_hash=$HASH" >> $GITHUB_OUTPUT

          echo "Certificate size: $SIZE_HEX ($SIZE_DEC bytes)"
          echo "Certificate hash: $HASH"

  build-ksuinit:
    uses: ./.github/workflows/ksuinit.yml
    with:
      arch: arm64

  build-ksud:
    needs: [build-ksuinit]
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
        os: [ubuntu-latest]
    uses: ./.github/workflows/ksud.yml
    with:
      target: ${{ matrix.target }}
      os: ${{ matrix.os }}
      pack_lkm: false

  build-manager:
    needs: [prepare]
    runs-on: ubuntu-latest
    if: always() && needs.prepare.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        build_type: [ "release" ]
    defaults:
      run:
        working-directory: ./manager

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine commit for build
        id: commit
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "COMMIT_SHA=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          else
            echo "COMMIT_SHA=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Write key
        if: ${{ github.event_name == 'workflow_dispatch' || ( github.event_name != 'pull_request') || github.ref_type == 'tag' }}
        run: |
          if [ ! -z "${{ secrets.KEYSTORE }}" ]; then
            {
              echo KEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}'
              echo KEY_ALIAS='${{ secrets.KEY_ALIAS }}'
              echo KEY_PASSWORD='${{ secrets.KEY_PASSWORD }}'
              echo KEYSTORE_FILE='key.jks'
            } >> gradle.properties
            echo "${{ secrets.KEYSTORE }}" | base64 -d > key.jks
          fi

      - name: Write PR key
        if: github.event_name == 'pull_request'
        env:
          PR_KEYSTORE: ${{ needs.prepare.outputs.keystore }}
          PR_KEYSTORE_PASSWORD: ${{ needs.prepare.outputs.keystore_password }}
          PR_KEY_PASSWORD: ${{ needs.prepare.outputs.key_password }}
        run: |
          echo "$PR_KEYSTORE" | base64 -d > pr-key.jks
          {
            echo KEYSTORE_PASSWORD="$PR_KEYSTORE_PASSWORD"
            echo KEY_ALIAS='pr-key'
            echo KEY_PASSWORD="$PR_KEY_PASSWORD"
            echo KEYSTORE_FILE='pr-key.jks'
          } >> gradle.properties
      
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build APK
        run: |
          export BUILD_EXTRA_ARGS=""
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            export KSU_PACKAGE_NAME="org.bakasu.bakasu.pr${{github.event.pull_request.number}}"
            export BUILD_EXTRA_ARGS="-PKSU_PACKAGE_NAME=$KSU_PACKAGE_NAME"
          elif [ "${{ github.ref_type }}" != "tag" ] && [ "${{ github.ref_name }}" != "main" ]; then
            export KSU_PACKAGE_NAME="org.bakasu.bakasu.dev"
            export KSU_NAME="BakaSU-DEV"
            export BUILD_EXTRA_ARGS="-PKSU_PACKAGE_NAME=$KSU_PACKAGE_NAME -PKSU_NAME=$KSU_NAME"
          fi

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            ./gradlew assembleRelease -Pcommit=${{ steps.commit.outputs.COMMIT_SHA }} -PIS_PR_BUILD=true $BUILD_EXTRA_ARGS
          else
            ./gradlew assembleRelease -Pcommit=${{ steps.commit.outputs.COMMIT_SHA }} $BUILD_EXTRA_ARGS
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Manager-gradle-release
          path: manager/app/build/outputs/apk/release/*.apk

      - name: Upload mappings
        uses: actions/upload-artifact@v7
        with:
          name: "Manager-mappings"
          path: "manager/app/build/outputs/mapping/release/"
          if-no-files-found: ignore

  repack-manager:
    if: always() && needs.build-manager.result == 'success' && needs.build-ksud.result == 'success'
    needs: [build-manager, build-ksud, prepare]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [ "release" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: Manager-gradle-release
          path: artifacts/Manager-gradle-release
      
      - name: Download arm64 ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-aarch64-linux-android
          path: artifacts/ksud-aarch64-linux-android

      - name: Place manager apk and ksud artifacts
        run: |
          mkdir -p manager/app/build/outputs/apk/release
          APKS=$(find artifacts/Manager-gradle-release -type f -name "*arm64-v8a*.apk" -o -name "*universal*.apk")
          APKS=$(echo "$APKS" | tr '\n' ' ')
          test -n "$APKS"
          cp -f $APKS manager/app/build/outputs/apk/release/

          mkdir -p target/aarch64-linux-android/release
          ARM64_KSUD=$(find artifacts/ksud-aarch64-linux-android -type f -name ksud | head -n 1)
          test -n "$ARM64_KSUD"
          cp -f "$ARM64_KSUD" target/aarch64-linux-android/release/ksud

      - name: Prepare signing inputs
        env:
          PR_KEYSTORE: ${{ needs.prepare.outputs.keystore }}
          PR_KEYSTORE_PASSWORD: ${{ needs.prepare.outputs.keystore_password }}
          PR_KEY_PASSWORD: ${{ needs.prepare.outputs.key_password }}
          PROD_KEYSTORE: ${{ secrets.KEYSTORE }}
          PROD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PROD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PROD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$PROD_KEYSTORE" ]; then
            echo "$PROD_KEYSTORE" | base64 -d > key.jks
            echo "SIGN_KEYSTORE_FILE=key.jks" >> $GITHUB_ENV
            echo "SIGN_KEY_ALIAS=$PROD_KEY_ALIAS" >> $GITHUB_ENV
            echo "SIGN_KEYSTORE_PASSWORD=$PROD_KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "SIGN_KEY_PASSWORD=$PROD_KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "$PR_KEYSTORE" | base64 -d > pr-key.jks
            echo "SIGN_KEYSTORE_FILE=pr-key.jks" >> $GITHUB_ENV
            echo "SIGN_KEY_ALIAS=pr-key" >> $GITHUB_ENV
            echo "SIGN_KEYSTORE_PASSWORD=$PR_KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "SIGN_KEY_PASSWORD=$PR_KEY_PASSWORD" >> $GITHUB_ENV
          fi

      - name: Repack and resign
        run: |
          python3 repack_apk_multi.py repack \
            -b release \
            -t release \
            -a arm64-v8a \
            -K "$SIGN_KEYSTORE_FILE" \
            -A "$SIGN_KEY_ALIAS" \
            -P "$SIGN_KEYSTORE_PASSWORD" \
            -S "$SIGN_KEY_PASSWORD" \
            --strip

      - name: Delete gradle build
        uses: GeekyEggo/delete-artifact@v6
        with:
          name: Manager-gradle-release
        
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: BakaSU-PocoF3-arm64-v8a-release
          path: dist/*arm64-v8a*.apk

  publish-release:
    name: Publish Manager to Release
    needs: repack-manager
    if: github.ref == 'refs/heads/custom/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release manager
        uses: actions/download-artifact@v8
        with:
          name: BakaSU-PocoF3-arm64-v8a-release
          path: release-apk

      - name: Delete intermediate artifacts
        uses: GeekyEggo/delete-artifact@v6
        with:
          name: |
            ksud-aarch64-linux-android
            ksuinit-aarch64
            Manager-mappings
          failOnError: false

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: "BakaSU Manager - Poco F3 (Alioth)"
          body: |
            ### BakaSU Manager (Poco F3 Alioth ARM64)
            - **Target Device**: Poco F3 / Redmi K40 / Mi 11X (`alioth`)
            - **Architecture**: ARM64-v8a (aarch64)
            - **Variant**: Release
            - **Commit**: ${{ github.sha }}
            - **Branch**: `${{ github.ref_name }}`
            
            Unduh langsung berkas `.apk` murni tanpa arsip zip di bawah ini:
          prerelease: true
          files: release-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
